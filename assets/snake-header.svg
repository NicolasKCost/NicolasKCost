<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 48" width="900" height="48">
  <style>
    text { font-family: Consolas, 'SFMono-Regular', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
    @keyframes typeonce { to { clip-path: inset(0 0 0 0); } }
  </style>
  <rect x="1" y="1" width="898" height="46" rx="10" fill="#0a0e14" stroke="#1f3b2d" stroke-width="2"/>
  <g>
    <text x="24" y="30" font-size="15" fill="#00ff9c" class="fade" style="animation-delay:0.1s" textLength="153.0" lengthAdjust="spacingAndGlyphs">nicolas@lisboa:~$</text>
    <text x="186.0" y="30" font-size="15" fill="#e6edf3" textLength="261.0" lengthAdjust="spacingAndGlyphs"
      style="clip-path: inset(0 100% 0 0); animation: typeonce 1.305s steps(29) 0.4s forwards">./snake --comer=contribuicoes</text>
  </g>
</svg>