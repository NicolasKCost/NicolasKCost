<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 374" width="900" height="374">
  <style>
    text { font-family: Consolas, 'SFMono-Regular', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
    @keyframes typeonce { to { clip-path: inset(0 0 0 0); } }
    .draw { stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 2.2s ease-out 1.3s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
  <rect x="1" y="1" width="898" height="372" rx="10" fill="#0a0e14" stroke="#1f3b2d" stroke-width="2"/>
