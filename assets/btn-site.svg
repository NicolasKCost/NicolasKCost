<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" width="220" height="52">
  <style>
    text { font-family: Consolas, 'SFMono-Regular', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
    
    .b { animation: glow 2.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { stroke: #1f8a5b; } 50% { stroke: #00ff9c; } }
  </style>
  <rect class="b" x="1.5" y="1.5" width="217" height="49" rx="8" fill="#0a0e14" stroke-width="2"/>
  <text x="110.0" y="32" text-anchor="middle" font-size="16" fill="#00ff9c"><tspan fill="#7d8590">[</tspan> umcvporvaga.pt <tspan fill="#7d8590">]</tspan></text>
</svg>