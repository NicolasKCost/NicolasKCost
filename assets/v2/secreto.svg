<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="900" height="64">
  <style>
    text { font-family: Consolas, 'SFMono-Regular', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
    .scr { animation: scr .12s steps(1) infinite; } @keyframes scr { 50% { transform: translateX(3px); opacity: .6; } }
    .lock { animation: lock 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes lock { 50% { transform: rotate(-8deg); } }
  </style>
  <rect x="1" y="1" width="898" height="62" rx="10" fill="#0a0e14" stroke="#5c1a2a" stroke-width="2" stroke-dasharray="6 4"/>
  <g class="lock" fill="none" stroke="#ff5f56" stroke-width="2"><rect x="24" y="28" width="20" height="16" rx="2"/><path d="M28 28 v-5 a6 6 0 0 1 12 0 v5"/></g>
  <text x="60" y="30" font-size="15" fill="#ff5f56">segredo.enc  ·  ACESSO RESTRITO</text>
  <text class="scr" x="60" y="50" font-size="12" fill="#7d8590">99b2ac757f8290996dd9de5798121e8fa462d6e85bda6a317873a59e</text>
  <text x="876" y="40" font-size="14" fill="#00ff9c" text-anchor="end">▸ clica para desencriptar</text>
</svg>