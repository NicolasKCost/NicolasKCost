name: Estatísticas (neofetch)

on:
  schedule:
    - cron: "23 6 * * *"   # todo dia, 06:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/gen_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar card de estatísticas
        run: python3 .github/scripts/gen_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Guardar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "Atualiza estatísticas" && git push)
