<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200">
  <style>
    text { font-family: Consolas, 'SFMono-Regular', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
    
    .card { animation: border 3s ease-in-out infinite; }
    @keyframes border { 0%,100% { stroke: #1f3b2d; } 50% { stroke: #1f8a5b; } }
    .sweep { animation: sweep 4s linear infinite; }
    @keyframes sweep { from { transform: translateX(-120px); } to { transform: translateX(560px); } }
  </style>
  <defs>
    <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset=".5" stop-color="#00ff9c" stop-opacity=".9"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="438" height="198" rx="10"/></clipPath>
  </defs>
  <g class="fade" style="animation-delay:0.7s">
  <rect class="card" x="1" y="1" width="438" height="198" rx="10" fill="#0a0e14" stroke="#1f3b2d" stroke-width="2"/>
  <g clip-path="url(#c)"><rect class="sweep" style="animation-delay:0.7s" x="0" y="1" width="120" height="2" fill="url(#sw)"/></g>
  <path d="M20 30 h10 l4 4 h14 v16 h-28 z" fill="none" stroke="#e3b341" stroke-width="1.8"/>
  <text x="58" y="48" font-size="19" font-weight="bold" fill="#e6edf3">Zágora</text>
  <circle class="pulse" cx="358" cy="42" r="5" fill="#00ff9c"/>
  <text x="370" y="47" font-size="13" fill="#00ff9c">online</text>
  <text x="20" y="84" font-size="13.5" fill="#c9d1d9">Bot de finanças pessoais no Telegram com IA</text><text x="20" y="104" font-size="13.5" fill="#c9d1d9">e testes automáticos.</text>
  <rect x="20" y="128" width="37.6" height="22" rx="4" fill="#0f2a1e" stroke="#1f8a5b"/><text x="28" y="143" font-size="12" fill="#00ff9c" textLength="21.6" lengthAdjust="spacingAndGlyphs">PHP</text><rect x="63.6" y="128" width="52.0" height="22" rx="4" fill="#0f2a1e" stroke="#1f8a5b"/><text x="71.6" y="143" font-size="12" fill="#00ff9c" textLength="36.0" lengthAdjust="spacingAndGlyphs">MySQL</text><rect x="121.6" y="128" width="102.4" height="22" rx="4" fill="#0f2a1e" stroke="#1f8a5b"/><text x="129.6" y="143" font-size="12" fill="#00ff9c" textLength="86.4" lengthAdjust="spacingAndGlyphs">Telegram API</text><rect x="230.0" y="128" width="30.4" height="22" rx="4" fill="#0f2a1e" stroke="#1f8a5b"/><text x="238.0" y="143" font-size="12" fill="#00ff9c" textLength="14.4" lengthAdjust="spacingAndGlyphs">IA</text>
  <text x="20" y="181" font-size="13" fill="#56d4ff">→ zagora.space</text>
  </g>
</svg>