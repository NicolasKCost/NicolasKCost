<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 44" width="168" height="44">
  <style>
    text { font-family: Consolas, 'SFMono-Regular', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
    .b { animation: glow 2.4s ease-in-out infinite; animation-delay: 0.8999999999999999s; }
    @keyframes glow { 0%,100% { stroke: #1f8a5b; fill: #0a0e14; } 50% { stroke: #00ff9c; fill: #0f2a1e; } }
  </style>
  <rect class="b" x="1.5" y="1.5" width="165" height="41" rx="6" stroke-width="2"/>
  <text x="14" y="27" font-size="14" fill="#7d8590">03</text>
  <text x="40" y="27" font-size="15" fill="#00ff9c">./projetos</text>
</svg>