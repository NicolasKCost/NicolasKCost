<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 144" width="900" height="144">
  <style>
    text { font-family: Consolas, 'SFMono-Regular', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
    
    .card { animation: border 3s ease-in-out infinite; }
    @keyframes border { 0%,100% { stroke: #1f3b2d; } 50% { stroke: #00ff9c; } }
    .scan { animation: scan 3.5s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .8; } 90% { opacity: .8; } 100% { transform: translateY(150px); opacity: 0; } }
    .up { animation: up 1.5s steps(1) infinite; } @keyframes up { 50% { opacity: .35; } }
  </style>
  <defs><linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset="1" stop-color="#00ff9c" stop-opacity=".25"/></linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="898" height="142" rx="10"/></clipPath></defs>
  <rect class="card" x="1" y="1" width="898" height="142" rx="10" fill="#0a0e14" stroke="#1f3b2d" stroke-width="2"/>
  <g clip-path="url(#c)"><rect class="scan" x="0" y="-30" width="900" height="30" fill="url(#sc)"/></g>
  <path d="M20 30 h10 l4 4 h14 v16 h-28 z" fill="none" stroke="#e3b341" stroke-width="1.8"/>
  <text x="58" y="48" font-size="19" font-weight="bold" fill="#e6edf3">Um CV por Vaga</text>
