<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 414" width="900" height="414">
  <style>
    text { font-family: Consolas, 'SFMono-Regular', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace; }
    .fade { opacity: 0; animation: fade .5s ease-out forwards; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .blink { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }
    @keyframes typeonce { to { clip-path: inset(0 0 0 0); } }
    .grow { transform: scaleX(0); transform-box: fill-box; transform-origin: left; animation: grow .5s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <defs><linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#0b6b43"/><stop offset="1" stop-color="#00ff9c"/></linearGradient></defs>
  <rect x="1" y="1" width="898" height="412" rx="10" fill="#0a0e14" stroke="#1f3b2d" stroke-width="2"/>
  <path d="M1 11 a10 10 0 0 1 10 -10 H889 a10 10 0 0 1 10 10 V34 H1 Z" fill="#161b22"/>
  <line x1="1" y1="34" x2="899" y2="34" stroke="#1f3b2d"/>
  <circle cx="20" cy="17.5" r="6" fill="#ff5f56"/><circle cx="40" cy="17.5" r="6" fill="#ffbd2e"/><circle cx="60" cy="17.5" r="6" fill="#27c93f"/>
